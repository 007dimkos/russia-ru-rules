name: Compile Unified Rules

permissions:
  contents: write

on:
  push:
    paths:
      - 'ru-limitless.json'
      - 'custom_list.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Ежедневно в 5 утра

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: sudo apt-get install jq -y

      - name: Download and Sync Lists
        run: |
          # Скачиваем IPTV с проверкой HTTP-статуса
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/Dimonovich/TV/refs/heads/Dimonovich/FREE/TV" -o IPTV_FULL_LIST.m3u8 || echo "" > IPTV_FULL_LIST.m3u8
          grep -oP 'https?://\K[^/[:space:]]+' IPTV_FULL_LIST.m3u8 | sed 's/:.*//' | sort -u > all_hosts.txt || true
          
          # Генерируем IP и Домены IPTV для корня
          grep -P '^(\d{1,3}\.){3}\d{1,3}$' all_hosts.txt | grep -v '127.0.0.1' > iptv_ip.txt || true
          grep -P '[a-zA-Z]' all_hosts.txt > iptv_domains.txt || true

          # Скачиваем внешние списки
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/v2fly/domain-list-community/refs/heads/master/data/yandex" -o yandex.txt || echo "" > yandex.txt
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/v2fly/domain-list-community/refs/heads/master/data/category-retail-ru" -o retail.txt || echo "" > retail.txt
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/v2fly/domain-list-community/refs/heads/master/data/category-media-ru" -o media.txt || echo "" > media.txt
          curl -fsSL --retry 3 "https://github.com/hxehex/russia-mobile-internet-whitelist/raw/refs/heads/main/whitelist.txt" -o whitelist_mobile.txt || echo "" > whitelist_mobile.txt

      - name: Commit Updated Lists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add yandex.txt retail.txt media.txt whitelist_mobile.txt iptv_domains.txt iptv_ip.txt IPTV_FULL_LIST.m3u8
          git commit -m "Sync source lists: $(date +'%d.%m.%Y')" || echo "No changes"
          git push || echo "No changes to push"

      - name: Process and Merge
        run: |
          touch custom_list.txt
          cp yandex.txt y.tmp && cp retail.txt r.tmp && cp media.txt m.tmp && cp whitelist_mobile.txt w.tmp
          sed -i '/^#/d; s/@.*//; s/[[:space:]]//g; /^$/d' y.tmp r.tmp m.tmp w.tmp iptv_domains.txt custom_list.txt
          
          jq -r '.rules[0].domain[] // empty' ru-limitless.json > manual_domains.txt
          jq -r '.rules[0].domain_suffix[] // empty' ru-limitless.json > manual_suffixes.txt

          cat manual_domains.txt iptv_domains.txt y.tmp r.tmp m.tmp w.tmp custom_list.txt | sort -u | grep -v '^$' > all_final_domains.txt

          # Безопасная сборка JSON через jq
          jq -n \
            --rawfile domains all_final_domains.txt \
            --rawfile suffixes manual_suffixes.txt \
            --rawfile ips iptv_ip.txt \
            '{
              version: 1,
              rules: [
                {
                  domain: ($domains | split("\n") | map(select(length > 0))),
                  domain_suffix: ($suffixes | split("\n") | map(select(length > 0))),
                  ip_cidr: ($ips | split("\n") | map(select(length > 0)))
                }
              ]
            }' > final.json

      - name: Install Sing-box
        run: |
          curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box .
          chmod +x sing-box

      - name: Final Compile
        run: |
          mkdir -p output
          ./sing-box rule-set compile --output output/RUZONEcountry.srs final.json

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          files: output/RUZONEcountry.srs
          body: "Единый скомпилированный файл RUZONEcountry.srs. Исходники обновлены в корне."
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
